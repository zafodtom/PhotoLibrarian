name: PhotoLibrarian Windows Build and Release

on:
  push:
    branches: [feature/trimenor-updates-ci, master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish 1.1.0 as stable GitHub Release
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: photolibrarian-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile application and tests
        shell: pwsh
        run: |
          dotnet build src/PhotoLibrarian.Tests/PhotoLibrarian.Tests.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute automated tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet run --project src/PhotoLibrarian.Tests/PhotoLibrarian.Tests.csproj -c Release -p:Platform=x64 --no-build -- -result-xml artifacts/test-results/tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Inno Setup installer
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -Version 1.1.0
      - name: Create release checksums
        shell: pwsh
        run: |
          $file = "artifacts/installer/PhotoLibrarian-1.1.0-Setup-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PhotoLibrarian-1.1.0-Setup-x64.exe" | Set-Content artifacts/installer/SHA256SUMS.txt -Encoding utf8
          $manifest = @{ schema = 1; version = '1.1.0'; installer = @{ name = 'PhotoLibrarian-1.1.0-Setup-x64.exe'; size = (Get-Item $file).Length; sha256 = $hash } } | ConvertTo-Json -Depth 5
          Set-Content artifacts/installer/photolibrarian-update.json $manifest -Encoding utf8
      - name: Upload installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLibrarian-1.1.0-windows-x64
          path: |
            artifacts/installer/PhotoLibrarian-1.1.0-Setup-x64.exe
            artifacts/installer/SHA256SUMS.txt
            artifacts/installer/photolibrarian-update.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable GitHub Release (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $isPrivate = gh api "repos/$repo" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $isPrivate -ne 'false') { throw 'Public GitHub Release required for updates.' }
          gh release view v1.1.0 --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.1.0 already exists. Never replace a published update.' }
          gh release create v1.1.0 artifacts/installer/PhotoLibrarian-1.1.0-Setup-x64.exe artifacts/installer/SHA256SUMS.txt artifacts/installer/photolibrarian-update.json --repo $repo --target $env:GITHUB_SHA --title 'PhotoLibrarian 1.1.0 by Trimenor' --notes-file docs/releases/1.1.0.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release edit v1.1.0 --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; inspect the draft.' }
