name: PhotoLibrarian Windows Build and Release

on:
  # Installer builds and publishing are deliberately manual. Pull requests
  # and ordinary pushes are validated by windows-ci.yml instead.
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish current project version as stable GitHub Release
        type: boolean
        required: false
        default: false

      publish_development:
        description: Publish selected non-master branch as development prerelease
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: photolibrarian-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Read version from project metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PhotoLibrarian/PhotoLibrarian.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid SemVer: $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate channel and prepare release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STABLE: ${{ inputs.publish_release }}
          PUBLISH_DEVELOPMENT: ${{ inputs.publish_development }}
        run: |
          if ($env:PUBLISH_STABLE -eq 'true' -and $env:PUBLISH_DEVELOPMENT -eq 'true') {
            throw 'Choose only one release channel.'
          }
          if ($env:PUBLISH_STABLE -eq 'true' -and $env:GITHUB_REF -ne 'refs/heads/master') {
            throw 'Stable releases require master.'
          }
          if ($env:PUBLISH_DEVELOPMENT -eq 'true') {
            if ($env:GITHUB_REF -eq 'refs/heads/master') {
              throw 'Development releases must use a non-master branch.'
            }
            $stableTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
            if ($LASTEXITCODE -ne 0) { throw 'Latest stable release lookup failed.' }
            if (-not $stableTag.StartsWith('v')) { throw 'Invalid stable tag.' }
            $stableVersion = [version]$stableTag.Substring(1)
            $projectVersion = [version]$env:VERSION
            if ($projectVersion -le $stableVersion) {
              $version = "$($stableVersion.Major).$($stableVersion.Minor).$($stableVersion.Build + 1)"
            } else {
              $version = $env:VERSION
            }
            "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            # Use sequential prerelease numbers per version, rather than
            # global GitHub Actions run numbers. The first vX.Y.Z dev
            # release must be dev.1, then dev.2 etc.
            $existingTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            if ($LASTEXITCODE -ne 0) { throw 'Development release list lookup failed.' }
            $escapedVersion = [regex]::Escape($version)
            $maxBuild = 0
            foreach ($existingTag in $existingTags) {
              if ($existingTag -match "^v$escapedVersion-dev[.](\d+)$") {
                $maxBuild = [Math]::Max($maxBuild, [int]$Matches[1])
              }
            }
            $nextBuild = $maxBuild + 1
            "DEV_RELEASE_TAG=v${version}-dev.$nextBuild" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      # Detect version/tag problems before spending minutes on installer work.
      - name: Validate stable release prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "Release notes missing: $notes" }
          # A missing release is normal. Avoid gh release view (404 / exit 1),
          # which is a terminating native-command error in PowerShell 7.
          $releaseTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify existing GitHub releases.' }
          if ($releaseTags -contains $tag) {
            throw "Stable release $tag already exists. Bump the project version; published assets are immutable."
          }
      - name: Compile application and tests
        shell: pwsh
        run: |
          dotnet build src/PhotoLibrarian.Tests/PhotoLibrarian.Tests.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute automated tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet run --project src/PhotoLibrarian.Tests/PhotoLibrarian.Tests.csproj -c Release -p:Platform=x64 --no-build -- -result-xml artifacts/test-results/tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Inno Setup installer
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -Version $env:VERSION
      - name: Generate checksums and manifest
        shell: pwsh
        run: |
          $file = "artifacts/installer/PhotoLibrarian-$env:VERSION-Setup-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PhotoLibrarian-$env:VERSION-Setup-x64.exe" | Set-Content artifacts/installer/SHA256SUMS.txt -Encoding utf8
          $manifest = @{ schema = 1; version = $env:VERSION; installer = @{ name = "PhotoLibrarian-$env:VERSION-Setup-x64.exe"; size = (Get-Item $file).Length; sha256 = $hash } } | ConvertTo-Json -Depth 5
          Set-Content artifacts/installer/photolibrarian-update.json $manifest -Encoding utf8
      - name: Upload installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLibrarian-windows-x64
          path: |
            artifacts/installer/PhotoLibrarian-*-Setup-x64.exe
            artifacts/installer/SHA256SUMS.txt
            artifacts/installer/photolibrarian-update.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable GitHub Release (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $isPrivate = gh api "repos/$repo" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $isPrivate -ne 'false') { throw 'Public GitHub Release required for updates.' }
          $tag = "v$env:VERSION"
          # Repeat the safe check immediately before publishing.
          $releaseTags = @(gh api "repos/$repo/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify existing GitHub releases.' }
          if ($releaseTags -contains $tag) { throw "Release $tag exists; never replace published update assets." }
          $installer = "artifacts/installer/PhotoLibrarian-$env:VERSION-Setup-x64.exe"
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "Release notes missing: $notes" }
          gh release create $tag $installer artifacts/installer/SHA256SUMS.txt artifacts/installer/photolibrarian-update.json --repo $repo --target $env:GITHUB_SHA --title "PhotoLibrarian $env:VERSION by Trimenor" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; inspect the draft.' }
      - name: Publish development GitHub prerelease (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_development && github.ref != 'refs/heads/master' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $isPrivate = gh api "repos/$repo" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $isPrivate -ne 'false') { throw 'Public GitHub prerelease required.' }
          $tag = $env:DEV_RELEASE_TAG
          if (-not $tag.StartsWith("v$env:VERSION-dev.")) { throw 'Invalid development tag.' }
          $releaseTags = @(gh api "repos/$repo/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify existing development releases.' }
          if ($releaseTags -contains $tag) { throw "Prerelease $tag already exists." }
          $installer = "artifacts/installer/PhotoLibrarian-$env:VERSION-Setup-x64.exe"
          $notesFile = "docs/releases/$env:VERSION-dev.md"
          if (-not (Test-Path $notesFile)) { throw "Development release notes missing: $notesFile" }
          gh release create $tag $installer artifacts/installer/SHA256SUMS.txt artifacts/installer/photolibrarian-update.json --repo $repo --target $env:GITHUB_SHA --title "PhotoLibrarian $tag (development)" --notes-file $notesFile --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Development prerelease creation failed.' }
